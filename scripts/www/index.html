            function renderStats() {
                try {
                    const rewardStatsList = document.getElementById('rewardStatsList');
                    const punishStatsList = document.getElementById('punishStatsList');
                    
                    // 渲染奖赏统计
                    if (Object.keys(rewardStats).length === 0) {
                        rewardStatsList.innerHTML = '<div class="empty-stats">暂无奖赏项统计</div>';
                    } else {
                        rewardStatsList.innerHTML = '';
                        rewardSubItems.forEach(item => {
                            const count = rewardStats[item.id] || 0;
                            const totalScore = count * item.score;
                            const itemEl = document.createElement('div');
                            itemEl.className = 'stats-item';
                            itemEl.innerHTML = `
                                <div class="stats-name">${getRewardCategoryNameById(item.categoryId)}-${item.name}</div>
                                <div class="stats-control">
                                    <button class="stats-btn minus-btn" data-type="reward" data-id="${item.id}">-</button>
                                    <div class="stats-num">${count}</div>
                                    <button class="stats-btn plus-btn" data-type="reward" data-id="${item.id}">+</button>
                                    <div>总计+${totalScore}分</div>
                                </div>
                            `;
                            rewardStatsList.appendChild(itemEl);
                        });
                    }

                    // 渲染惩罚统计
                    if (Object.keys(punishStats).length === 0) {
                        punishStatsList.innerHTML = '<div class="empty-stats">暂无惩罚项统计</div>';
                    } else {
                        punishStatsList.innerHTML = '';
                        punishSubItems.forEach(item => {
                            const count = punishStats[item.id] || 0;
                            const totalScore = count * item.score;
                            const itemEl = document.createElement('div');
                            itemEl.className = 'stats-item';
                            itemEl.innerHTML = `
                                <div class="stats-name">${getPunishCategoryNameById(item.categoryId)}-${item.name}</div>
                                <div class="stats-control">
                                    <button class="stats-btn minus-btn" data-type="punish" data-id="${item.id}">-</button>
                                    <div class="stats-num">${count}</div>
                                    <button class="stats-btn plus-btn" data-type="punish" data-id="${item.id}">+</button>
                                    <div>总计-${totalScore}分</div>
                                </div>
                            `;
                            punishStatsList.appendChild(itemEl);
                        });
                    }

                    // 绑定统计加减按钮事件
                    document.querySelectorAll('.stats-btn').forEach(btn => {
                        btn.addEventListener('click', function() {
                            const type = this.dataset.type;
                            const id = this.dataset.id;
                            const isPlus = this.classList.contains('plus-btn');
                            
                            if (type === 'reward') {
                                rewardStats[id] = Math.max(0, (rewardStats[id] || 0) + (isPlus ? 1 : -1));
                                const item = rewardSubItems.find(i => i.id === id);
                                if (item) {
                                    const scoreChange = (isPlus ? 1 : -1) * item.score;
                                    currentScore = Math.min(999, Math.max(0, currentScore + scoreChange));
                                    localStorage.setItem('currentScore', currentScore);
                                }
                                localStorage.setItem('rewardStats', JSON.stringify(rewardStats));
                            } else {
                                punishStats[id] = Math.max(0, (punishStats[id] || 0) + (isPlus ? 1 : -1));
                                const item = punishSubItems.find(i => i.id === id);
                                if (item) {
                                    const scoreChange = (isPlus ? -1 : 1) * item.score;
                                    currentScore = Math.min(999, Math.max(0, currentScore + scoreChange));
                                    localStorage.setItem('currentScore', currentScore);
                                }
                                localStorage.setItem('punishStats', JSON.stringify(punishStats));
                            }
                            renderStats();
                            initScore();
                        });
                    });
                } catch (e) {
                    console.error('渲染统计失败:', e);
                }
            }

            // ---------------------- 兑换项功能 ----------------------
            let exchangeItems = JSON.parse(localStorage.getItem('exchangeItems')) || [];

            window.openExchangeModal = function(id = '') {
                if (id) {
                    const item = exchangeItems.find(i => i.id === id);
                    if (item) {
                        document.getElementById('exchangeItemId').value = id;
                        document.getElementById('exchangeItemName').value = item.name || '';
                        document.getElementById('exchangeItemPoints').value = item.points || '';
                        document.getElementById('exchangeItemStock').value = item.stock || 0;
                        document.getElementById('exchangeItemDetails').value = item.details || '';
                        document.getElementById('exchangeModalTitle').textContent = '编辑兑换项';
                        document.getElementById('exchangeDeleteBtn').style.display = 'block';
                    }
                } else {
                    document.getElementById('exchangeItemId').value = '';
                    document.getElementById('exchangeItemName').value = '';
                    document.getElementById('exchangeItemPoints').value = '';
                    document.getElementById('exchangeItemStock').value = 0;
                    document.getElementById('exchangeItemDetails').value = '';
                    document.getElementById('exchangeModalTitle').textContent = '新增兑换项';
                    document.getElementById('exchangeDeleteBtn').style.display = 'none';
                }
                document.getElementById('exchangeEditModal').style.display = 'flex';
            }

            function renderExchangeList() {
                try {
                    const container = document.getElementById('exchangeContainer');
                    if (exchangeItems.length === 0) {
                        container.innerHTML = '<div class="empty-tip">暂无兑换项，点击右下角+添加</div>';
                        return;
                    }
                    container.innerHTML = '';

                    exchangeItems.forEach(item => {
                        const isClosed = item.stock <= 0;
                        const itemEl = document.createElement('div');
                        itemEl.className = `exchange-item ${isClosed ? 'closed' : ''}`;
                        itemEl.dataset.id = item.id;
                        
                        // 处理图片显示
                        let imgHtml = '<div class="no-img">暂无图片</div>';
                        if (item.icon) {
                            imgHtml = `<img src="${item.icon}" alt="${item.name}">`;
                        }

                        itemEl.innerHTML = `
                            ${imgHtml}
                            <h3>${item.name || '未命名'}</h3>
                            <div class="points">${item.points || 0}积分</div>
                            <div class="stock">库存：${item.stock || 0}</div>
                            <div class="details" style="font-size:12px;color:#666;margin:5px 0;">${item.details || '暂无详情'}</div>
                            <button class="exchange-btn" ${isClosed ? 'disabled' : ''} data-id="${item.id}">
                                ${isClosed ? '已兑完' : '立即兑换'}
                            </button>
                        `;

                        // 点击兑换项卡片编辑
                        itemEl.addEventListener('click', function(e) {
                            if (!e.target.classList.contains('exchange-btn')) {
                                window.openExchangeModal(this.dataset.id);
                            }
                        });

                        // 绑定兑换按钮事件
                        const exchangeBtn = itemEl.querySelector('.exchange-btn');
                        exchangeBtn.addEventListener('click', function() {
                            const id = this.dataset.id;
                            const item = exchangeItems.find(i => i.id === id);
                            if (!item || item.stock <= 0) return;

                            if (currentScore < (item.points || 0)) {
                                alert('积分不足，无法兑换！');
                                return;
                            }

                            if (confirm(`确定兑换【${item.name}】吗？将扣除${item.points}积分`)) {
                                item.stock = Math.max(0, item.stock - 1);
                                currentScore = Math.max(0, currentScore - (item.points || 0));
                                
                                // 记录积分明细
                                const timeStr = new Date().toLocaleString('zh-CN', {
                                    year: 'numeric', month: '2-digit', day: '2-digit',
                                    hour: '2-digit', minute: '2-digit', second: '2-digit'
                                });
                                scoreDetails.unshift({
                                    type: 'exchange', 
                                    name: `兑换-${item.name}`, 
                                    score: `-${item.points}`,
                                    time: timeStr, 
                                    total: currentScore
                                });

                                localStorage.setItem('exchangeItems', JSON.stringify(exchangeItems));
                                localStorage.setItem('currentScore', currentScore);
                                localStorage.setItem('scoreDetails', JSON.stringify(scoreDetails));
                                
                                renderExchangeList();
                                initScore();
                                alert('兑换成功！');
                            }
                        });

                        container.appendChild(itemEl);
                    });
                } catch (e) {
                    console.error('渲染兑换项失败:', e);
                }
            }

            function saveExchangeItem() {
                const id = document.getElementById('exchangeItemId').value;
                const name = document.getElementById('exchangeItemName').value.trim();
                const points = parseInt(document.getElementById('exchangeItemPoints').value) || 0;
                const stock = parseInt(document.getElementById('exchangeItemStock').value) || 0;
                const details = document.getElementById('exchangeItemDetails').value.trim();
                const iconInput = document.getElementById('exchangeItemIcon');
                
                if (!name) {
                    alert('兑换物名称不能为空！');
                    return;
                }
                if (points < 1) {
                    alert('所需积分必须≥1！');
                    return;
                }

                let icon = '';
                // 处理图片上传
                if (iconInput.files && iconInput.files[0]) {
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        icon = e.target.result;
                        saveExchangeItemCore(id, name, points, stock, details, icon);
                    };
                    reader.readAsDataURL(iconInput.files[0]);
                } else {
                    // 无图片时直接保存
                    const oldItem = id ? exchangeItems.find(i => i.id === id) : null;
                    icon = oldItem ? oldItem.icon : '';
                    saveExchangeItemCore(id, name, points, stock, details, icon);
                }
            }

            function saveExchangeItemCore(id, name, points, stock, details, icon) {
                if (id) {
                    const index = exchangeItems.findIndex(i => i.id === id);
                    if (index !== -1) {
                        exchangeItems[index] = {
                            ...exchangeItems[index],
                            name, points, stock, details, icon
                        };
                    }
                } else {
                    exchangeItems.push({
                        id: generateId(),
                        name, points, stock, details, icon
                    });
                }
                localStorage.setItem('exchangeItems', JSON.stringify(exchangeItems));
                closeAllModals();
                renderExchangeList();
                // 清空文件输入
                document.getElementById('exchangeItemIcon').value = '';
            }

            function deleteExchangeItem() {
                const id = document.getElementById('exchangeItemId').value;
                if (!id) return;
                if (confirm('确定删除该兑换项吗？删除后不可恢复！')) {
                    exchangeItems = exchangeItems.filter(i => i.id !== id);
                    localStorage.setItem('exchangeItems', JSON.stringify(exchangeItems));
                    closeAllModals();
                    renderExchangeList();
                }
            }

            document.getElementById('rewardCategorySaveBtn').addEventListener('click', saveRewardCategory);
            document.getElementById('rewardCategoryCancelBtn').addEventListener('click', closeAllModals);
            document.getElementById('rewardAddFabBtn').addEventListener('click', () => openRewardCategoryModal());
            document.getElementById('rewardSubItemSaveBtn').addEventListener('click', saveRewardSubItem);
            document.getElementById('rewardSubItemCancelBtn').addEventListener('click', closeAllModals);
            document.getElementById('rewardSubDeleteBtn').addEventListener('click', deleteRewardSelectedSubItems);

            // 惩罚项事件
            document.getElementById('punishCategoryEditBtn').addEventListener('click', togglePunishCategoryEditMode);
            document.getElementById('punishCategoryDeleteBtn').addEventListener('click', deletePunishSelectedCategories);
            document.getElementById('punishCategorySaveBtn').addEventListener('click', savePunishCategory);
            document.getElementById('punishCategoryCancelBtn').addEventListener('click', closeAllModals);
            document.getElementById('punishAddFabBtn').addEventListener('click', () => openPunishCategoryModal());
            document.getElementById('punishSubItemSaveBtn').addEventListener('click', savePunishSubItem);
            document.getElementById('punishSubItemCancelBtn').addEventListener('click', closeAllModals);
            document.getElementById('punishSubDeleteBtn').addEventListener('click', deletePunishSelectedSubItems);

            // 兑换项事件
            document.getElementById('exchangeAddBtn').addEventListener('click', () => window.openExchangeModal());
            document.getElementById('exchangeSaveBtn').addEventListener('click', saveExchangeItem);
            document.getElementById('exchangeCancelBtn').addEventListener('click', closeAllModals);
            document.getElementById('exchangeDeleteBtn').addEventListener('click', deleteExchangeItem);

            // 初始化渲染
            renderRewardCategoryList();
            renderPunishCategoryList();
            initScore();
        });
    </script>
